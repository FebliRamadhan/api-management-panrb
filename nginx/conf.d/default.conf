# ─────────────────────────────────────────────────────
# Nginx reverse proxy.
# SSL termination dilakukan oleh Load Balancer di production
# (cookie.secure di app-nya bergantung ke X-Forwarded-Proto).
# Kalau butuh HTTPS lokal, taruh cert di nginx/ssl/ dan aktifkan
# block 443 di file ini (commented di bawah).
# ─────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Custom Admin Panel ─────────────────────────────
    location /wso2-admin/ {
        proxy_pass http://admin-panel:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Developer / Publisher / Admin Portals ──────────
    location /devportal {
        proxy_pass https://wso2apim:9443/devportal;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
    }

    location /publisher {
        proxy_pass https://wso2apim:9443/publisher;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
    }

    location /admin {
        proxy_pass https://wso2apim:9443/admin;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
    }

    location /carbon {
        proxy_pass https://wso2apim:9443/carbon;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
    }

    location /api/ {
        proxy_pass https://wso2apim:8243/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300;
    }

    location /custom-assets/ {
        alias /usr/share/nginx/html/custom-assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 302 /devportal;
    }
}

# ─────────────────────────────────────────────────────
# Optional HTTPS block — aktifkan kalau Nginx diminta TLS-terminate
# (mis. on-prem tanpa LB). Generate cert via setup.sh.

# ─────────────────────────────────────────────────────
# WSO2 API Manager - Main Configuration
# ─────────────────────────────────────────────────────

[server]
hostname = "localhost"
node_ip = "127.0.0.1"
mode = "single"
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"

[super_admin]
username = "admin"
password = "admin@WSO2#2024"
create_admin_account = true

[user_store]
type = "database_unique_id"

# ── Databases ─────────────────────────────────────────
[database.apim_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/apim_db?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;autoReconnect=true"
username = "apimuser"
password = "Apim@MySQL#2024"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/shared_db?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;autoReconnect=true"
username = "apimuser"
password = "Apim@MySQL#2024"
driver = "com.mysql.cj.jdbc.Driver"

# ── Keystore ──────────────────────────────────────────
[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# ── Gateway ───────────────────────────────────────────
[[apim.gateway.environment]]
name = "Production and Sandbox"
type = "hybrid"
display_in_api_console = true
description = "This is a hybrid gateway that handles production and sandbox token traffic."
show_as_token_endpoint_url = true
service_url = "https://localhost:9443/services/"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "http://localhost:8280"
https_endpoint = "https://localhost:8243"

# ── Key Manager ───────────────────────────────────────
[apim.key_manager]
service_url = "https://localhost:9443/services/"
username = "${admin.username}"
password = "${admin.password}"

# ── OAuth ─────────────────────────────────────────────
[apim.oauth_config]
revoke_endpoint = "https://localhost:8243/revoke"
enable_token_encryption = false
enable_token_hashing = false

# ── Throttling ────────────────────────────────────────
[apim.throttling]
username = "${admin.username}"
password = "${admin.password}"
service_url = "https://localhost:9443/services/"
throttle_decision_endpoints = ["tcp://localhost:5672"]

[apim.throttling.jms]
start_delay = "5000"

# ── Analytics (disabled by default) ──────────────────
[apim.analytics]
enable = false

# ── CORS ──────────────────────────────────────────────
[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction","apikey","Internal-Key"]
allow_credentials = false

# ── Dev Portal ────────────────────────────────────────
[apim.devportal]
url = "https://localhost:9443/devportal"
enable_application_sharing = false
application_sharing_type = "default"
display_multiple_versions = false
display_deprecated_apis = false
enable_comments = true
enable_ratings = true
enable_forum = false
enable_anonymous_mode = true
